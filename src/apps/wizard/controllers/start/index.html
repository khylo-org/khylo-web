<div id="wizardStartPage" data-role="page" class="page standalonePage wizardPage" data-backbutton="false">
    <div class="padded-left padded-right padded-top">
        <div class="ui-corner-all ui-shadow wizardContent" style="position:relative;">
            <form class="wizardStartForm">
                <header class="wizardHeader">
                    <div class="wizardKhyloIcon" role="img" aria-label="Khylo"></div>
                    <div class="wizardHeaderText">
                        <span class="wizardEyebrow">Khylo Server Setup</span>
                        <h1>${WelcomeToProject}</h1>
                    </div>
                    <a is="khylo-linkbutton" rel="noopener noreferrer" href="https://github.com/khylo-org/khylo/blob/main/Install/first-setup.md" target="_blank" class="wizardGuideLink">
                        <span>${ButtonQuickStartGuide}</span>
                    </a>
                </header>

                
                <p>${ThisWizardWillGuideYou}</p>
                <br />
                <div class="inputContainer">
                    <input is="khylo-input" type="text" id="txtServerName" label="${LabelServerName}" required="required" />
                    <div class="fieldDescription">${LabelServerNameHelp}</div>
                </div>
                <div class="selectContainer">
                    <select is="khylo-select" id="selectLocalizationLanguage" label="${LabelPreferredDisplayLanguage}"></select>
                </div>
                <br />

                <div class="wizardNavigation" style="text-align:right;">
                    <button is="khylo-button" type="submit" class="raised button-submit">
                        <span>${Next}</span>
                        <span class="material-icons arrow_forward" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
