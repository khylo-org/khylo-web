name: Bug report
description: Something in the Khylo web app or dashboard isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Khylo version
      description: Shown in the dashboard, for example DEV-V26.10.101
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: For example Firefox 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Press F12, open Console, and paste any red errors. Remove anything private first.
      render: shell
